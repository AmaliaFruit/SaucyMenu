name: core-tests
# Runs the Unity-free unit tests. The plugin itself needs the game's DLLs, which are never stored here,
# so it is built locally against your own install.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test tests/SaucyMenu.Core.Tests
